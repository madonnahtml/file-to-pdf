name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Immagini-in-PDF-Windows
          path: |
            dist/*.exe

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.exe --clobber
          else
            gh release create "$VERSION" dist/*.exe \
              --target "$GITHUB_SHA" \
              --title "Immagini in PDF $VERSION" \
              --notes "Scarica **Immagini-in-PDF-Setup** e fai doppio clic per installare: l'icona viene aggiunta al desktop. La versione **Portable** si avvia senza installazione."
          fi
